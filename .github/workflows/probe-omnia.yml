name: probe omnia
on:
  push:
    branches: [probe-omnia]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logo
        run: |
          mkdir -p probe
          curl -sSL -o probe/omnia_logo.png -w "%{http_code} %{content_type}\n" "https://d3neddlj774jsy.cloudfront.net/media/clients/1043987/career_page/logos/205a0c01-d836-400a-92dc-dec5617989ac_1783081056516.png" > probe/logo_status.txt
          curl -sSL -o probe/omnia_brand.png -w "%{http_code} %{content_type}\n" "https://d3neddlj774jsy.cloudfront.net/themes/media/clients/1043987/9602280b-9497-4142-81c8-e86df159c55d/fd_branding_logo/205a0c01-d836-400a-92dc-dec5617989acfd_branding_logo_1783080977482.png" >> probe/logo_status.txt
          cat probe/logo_status.txt
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe; git commit -m "probe omnia logo" || true; git push
