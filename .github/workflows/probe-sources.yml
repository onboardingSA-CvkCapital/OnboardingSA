name: Probe job sources (temporary)
on:
  push:
    branches: [probe-sources]
    paths-ignore: ['probe_out/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python probe/probe_sources.py
      - name: Save results to branch
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add -f probe_out && git commit -m "probe results" && git push
