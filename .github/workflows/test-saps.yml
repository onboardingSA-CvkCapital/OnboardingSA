name: Test SAPS scraper (temporary)
on:
  push:
    branches: [saps-scraper]
    paths-ignore: ['test_out/**']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - run: |
          mkdir -p test_out
          python scrape_saps.py --dry-run > test_out/saps.json 2> test_out/log.txt || true
          tail -5 test_out/log.txt
      - name: Save results to branch
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add -f test_out && git commit -m "SAPS test results" && git push
