name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        shell: bash {0}
        run: |
          mkdir -p probe20
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          A="https://api.smartrecruiters.com/v1/companies/OUTsurance/postings"
          curl -sSL -A "$UA" -o probe20/list.json -w "list %{http_code}\n" "$A?limit=100" > probe20/status.txt
          n=0
          for id in $(python3 -c "import json;c=json.load(open('probe20/list.json')).get('content',[]);print(' '.join(str(x['id']) for x in c[:3]+c[-2:]))"); do
            n=$((n+1)); curl -sSL -A "$UA" -o probe20/d$n.json -w "d$n %{http_code}\n" "$A/$id" >> probe20/status.txt
          done
          curl -sSL -A "$UA" -o probe20/home.html -w "home %{http_code} %{url_effective}\n" "https://www.outsurance.co.za/" >> probe20/status.txt
          L=$(grep -oiE '(src|href|content)="[^"]*(logo|og-image|apple-touch|favicon)[^"]*"' probe20/home.html | sed -E 's/^[a-z]+="//I; s/"$//' | sort -u | head -10)
          echo "$L" >> probe20/status.txt
          i=0; for u in $L; do i=$((i+1)); case "$u" in http*) U="$u";; //*) U="https:$u";; /*) U="https://www.outsurance.co.za$u";; *) U="https://www.outsurance.co.za/$u";; esac
            curl -sSL -A "$UA" -o "probe20/logo$i.${U##*.}" -w "logo$i %{http_code} %{content_type} $U\n" "$U" >> probe20/status.txt; done
          cat probe20/status.txt
      - name: Commit
        shell: bash {0}
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe20; git commit -m "probe outsurance" || true; git push
