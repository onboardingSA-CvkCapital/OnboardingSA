name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests gspread google-auth
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Fetch
        shell: bash {0}
        run: |
          mkdir -p probe14
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          B="https://randwater.erecruit.co"
          curl -sSL -A "$UA" -o probe14/browse.html -w "browse %{http_code} %{url_effective}\n" "$B/candidateapp/Jobs/Browse" > probe14/status.txt
          U=$(grep -o 'href="[^"]*Jobs/View[^"]*"' probe14/browse.html | head -1 | sed 's/href="//;s/"$//')
          echo "first $U" >> probe14/status.txt
          case "$U" in /*) U="$B$U";; esac
          [ -n "$U" ] && curl -sSL -A "$UA" -o probe14/detail.html -w "detail %{http_code}\n" "$U" >> probe14/status.txt
          curl -sSL -A "$UA" -o probe14/rw_home.html -w "home %{http_code}\n" "https://www.randwater.co.za/" >> probe14/status.txt
          grep -o 'https\?://[^"]*\(career\|vacanc\|erecruit\)[^"]*' probe14/rw_home.html | sort -u | head >> probe14/status.txt
          grep -o '<img[^>]*logo[^>]*>' probe14/rw_home.html | head -3 >> probe14/status.txt
          cat probe14/status.txt; ls -la probe14
      - name: Commit
        shell: bash {0}
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe14; git commit -m "probe rand water" || true; git push
