name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests gspread google-auth
      - name: Run
        run: |
          mkdir -p probe3
          mkdir -p probe3/pages; SAVE_PAGES=probe3/pages python scrape_aeci.py --dry-run > probe3/aeci.json 2> probe3/aeci.log || true
          tail -15 probe3/aeci.log
          curl -sSL -o probe3/aeci_logo.jpg "https://rmkcdn.successfactors.com/413fa29d/ea3441ed-b5ca-44d1-998c-7.jpg"
          ls -la probe3
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe3; git commit -m "probe aeci live" || true; git push
