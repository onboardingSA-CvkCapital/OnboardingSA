name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p probe5
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          B="https://careers.theheinekencompany.com"
          curl -sSL -A "$UA" -o probe5/h_p2.html -w "p2 %{http_code}\n" "$B/Job-Listing?field_location_country_code_1%5B0%5D=ZA&page=0%2C0%2C1" > probe5/status.txt
          curl -sSL -A "$UA" -o probe5/h_detail.html -w "detail %{http_code}\n" "$B/job/heineken-beverages/south-africa/electrical-technician" >> probe5/status.txt
          curl -sSL -A "$UA" -o probe5/h_detail2.html -w "detail2 %{http_code}\n" "$B/job/heineken-beverages/south-africa/global-graduate-marketing" >> probe5/status.txt
          curl -sSL -A "$UA" -o probe5/h_logo.svg "$B/sites/heineken-careers/files/heineken-careers/listing-page-logo/heineken-new-listing-page-logo.svg"
          curl -sSL -A "$UA" -o probe5/pnp_home.html "https://picknpay.wd3.myworkdayjobs.com/PNP_Careers"
          curl -sSL -A "$UA" -o probe5/sab_home.html "https://wd1.myworkdaysite.com/recruiting/abinbev/SAB"
          cat probe5/status.txt; ls -la probe5
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe5; git commit -m "probe heineken detail" || true; git push
