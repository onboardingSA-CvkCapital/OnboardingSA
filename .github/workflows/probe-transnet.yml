name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests gspread google-auth
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Fetch
        shell: bash {0}
        run: |
          mkdir -p probe16
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          B="https://randwater.erecruit.co/candidateapp"
          curl -sSL -A "$UA" -o probe16/d1.html -w "d1 %{http_code}\n" "$B/Jobs/View/RAN261029-9" > probe16/status.txt
          curl -sSL -A "$UA" -o probe16/cat2.html -w "cat2 %{http_code}\n" "$B/Jobs/Categories/Artisans/cb0ec670979f42909303d65b786312b8" >> probe16/status.txt
          U=$(grep -o "Jobs/View/[A-Z0-9-]*" probe16/cat2.html | head -1)
          curl -sSL -A "$UA" -o probe16/d2.html -w "d2 %{http_code} $U\n" "$B/$U" >> probe16/status.txt
          curl -sSL -A "$UA" -o probe16/logo.jpg -w "logo %{content_type}\n" "$B/theme/logo.jpg" >> probe16/status.txt
          cat probe16/status.txt
      - name: Commit
        shell: bash {0}
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe16; git commit -m "probe rand water 3" || true; git push
