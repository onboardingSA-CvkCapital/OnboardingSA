name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests gspread google-auth
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Fetch
        shell: bash {0}
        run: |
          mkdir -p probe13
          cat > shot.py <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(); pg=b.new_page(viewport={"width":1400,"height":900}, device_scale_factor=3)
              pg.goto("https://www.standardbank.co.za/southafrica/personal/home", wait_until="networkidle", timeout=90000)
              pg.wait_for_timeout(3000)
              pg.screenshot(path="probe13/page.png")
              for sel in ["header a[href*='home'] img","header img[alt*='Standard' i]","img[alt*='Standard Bank' i]","header svg","a[aria-label*='Standard Bank' i]","[class*=logo] img","[class*=logo]"]:
                  el=pg.query_selector(sel)
                  if el and el.is_visible():
                      el.screenshot(path="probe13/logo.png", omit_background=True); print("used",sel)
                      src=el.get_attribute("src"); print("src",src); break
              b.close()
          PY
          python shot.py > probe13/log.txt 2>&1; cat probe13/log.txt
      - name: Commit
        shell: bash {0}
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe13; git commit -m "probe sb logo 2" || true; git push
