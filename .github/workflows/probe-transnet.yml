name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        shell: bash {0}
        run: |
          mkdir -p probe19
          pip install -q playwright==1.47.0 > probe19/pip.txt 2>&1; python -m playwright install --with-deps chromium >> probe19/pip.txt 2>&1
          cat > shot.py <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          U = {"projects": "https://eskomcareers.ci.hr/applicant/index.php?controller=Listings&method=view&listingid=9775ce5b-2d5f-4a7b-a76c-c47b5867f03f"}
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1100, "height": 1400}, user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36")
              for k, u in U.items():
                  pg.goto(u, wait_until="networkidle", timeout=90000); time.sleep(4)
                  pg.screenshot(path=f"probe19/{k}.png", full_page=True)
                  open(f"probe19/{k}.txt", "w").write(pg.url + "\n\n" + pg.inner_text("body"))
              b.close()
          PY
          python shot.py > probe19/log.txt 2>&1; ls -la probe19
      - name: Commit
        shell: bash {0}
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe19; git commit -m "probe eskom advert" || true; git push
