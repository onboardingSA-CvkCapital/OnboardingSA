name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests gspread google-auth
      - name: Fetch
        shell: bash {0}
        run: |
          mkdir -p probe12
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" -o probe12/sr.html "https://careers.smartrecruiters.com/StandardBankGroup"
          grep -o 'https://[^"]*\(logo\|Logo\)[^"]*' probe12/sr.html | sort -u | head > probe12/urls.txt
          grep -o 'https://c.smartrecruiters.com/[^"]*' probe12/sr.html | sort -u | head >> probe12/urls.txt
          n=0; for u in $(cat probe12/urls.txt); do n=$((n+1)); curl -sSL -A "$UA" -o probe12/img$n "$u" -w "img$n %{content_type} $u\n" >> probe12/logo.txt; done
          cat probe12/urls.txt probe12/logo.txt
      - name: Commit
        shell: bash {0}
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe12; git commit -m "probe sb logo" || true; git push
