name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests gspread google-auth
      - name: Fetch
        shell: bash {0}
        run: |
          mkdir -p probe8
          python scrape_oracle.py --dry-run > probe8/tfg.json 2> probe8/tfg.log
          curl -sSL -o probe8/tfg_logo.png -w "%{http_code} %{content_type}\n" "https://stg-tfglimited-staging.kinsta.cloud/wp-content/uploads/2023/09/TFG_Logo_150x40px-1.png" > probe8/logo.txt
          curl -sSL -o probe8/tfg_logo2.png -w "%{http_code} %{content_type}\n" "https://www.tfglimited.co.za/wp-content/uploads/2023/09/TFG_Logo_150x40px-1.png" >> probe8/logo.txt
          tail -5 probe8/tfg.log; cat probe8/logo.txt
      - name: Commit
        shell: bash {0}
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe8; git commit -m "probe tfg live" || true; git push
