name: probe transnet
on:
  push:
    branches: [probe-transnet]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        shell: bash {0}
        run: |
          mkdir -p probe18
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" -o probe18/home.html -w "home %{http_code} %{url_effective}\n" "https://www.valterraplatinum.com/" > probe18/status.txt
          L=$(grep -oiE '(src|href|content)="[^"]*(logo|og-image|favicon|apple-touch)[^"]*"' probe18/home.html | sed -E 's/^[a-z]+="//I; s/"$//' | sort -u | head -8)
          echo "$L" >> probe18/status.txt
          i=0; for u in $L; do i=$((i+1)); case "$u" in http*) U="$u";; //*) U="https:$u";; /*) U="https://www.valterraplatinum.com$u";; *) U="https://www.valterraplatinum.com/$u";; esac
            curl -sSL -A "$UA" -o "probe18/logo$i.${U##*.}" -w "logo$i %{http_code} %{content_type} $U\n" "$U" >> probe18/status.txt; done
          cat probe18/status.txt
      - name: Commit
        shell: bash {0}
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe18; git commit -m "probe valterra logo" || true; git push
