name: Daily job scrape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright gspread google-auth requests
          python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils tesseract-ocr   # pdftotext (circular PDFs) + OCR (scanned adverts)

      - name: Write credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Eskom
        run: python scrape_eskom.py
        continue-on-error: true

      - name: Sasol
        run: python scrape_sasol.py
        continue-on-error: true

      - name: Omnia
        run: python scrape_omnia.py
        continue-on-error: true

      - name: Transnet
        run: python scrape_transnet.py
        continue-on-error: true

      - name: AECI and Capitec (SuccessFactors sites)
        run: python scrape_successfactors.py
        continue-on-error: true

      - name: SAB and Pick n Pay (Workday sites)
        run: python scrape_workday.py
        continue-on-error: true

      - name: Heineken
        run: python scrape_heineken.py
        continue-on-error: true

      - name: TFG (Oracle careers site)
        run: python scrape_oracle.py
        continue-on-error: true

      - name: DPSA Public Service Vacancy Circular
        run: python scrape_dpsa.py
        continue-on-error: true

      - name: SAPS (careers pages + e-Recruitment)
        run: python scrape_saps.py
        continue-on-error: true

      - name: KZN Department of Health
        run: python scrape_kznhealth.py
        continue-on-error: true

      - name: Delete expired
        run: python delete_expired.py
        continue-on-error: true

      - name: Build jobs.json
        run: python build_json.py

      - name: Dedupe jobs
        run: python dedupe_jobs.py

      - name: Build homepage data files (lite + first page)
        run: python build_lite.py

      - name: Build static job pages
        run: python build_static.py

      - name: Build employer pages
        run: python build_employers.py
        continue-on-error: true

      - name: Clean up credentials
        if: always()
        run: rm -f credentials.json

      - name: Commit site files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add jobs.json jobs-lite.json jobs-page-1.json index.html sitemap.xml jobs/ employers/
          git commit -m "Update jobs, static pages, sitemap" || echo "no changes"
          git push
